<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGradDHH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="hairGradDHH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#543828"/>
      <stop offset="50%" stop-color="#3d271c"/>
      <stop offset="100%" stop-color="#24150d"/>
    </linearGradient>
    <linearGradient id="skinGradDHH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbe5d6"/>
      <stop offset="100%" stop-color="#f0cbaf"/>
    </linearGradient>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGradDHH)" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Stylish Swept Dark Hair (Back) -->
  <path d="M 28 50 C 24 30, 36 12, 62 10 C 88 8, 98 22, 94 45 C 96 35, 94 20, 80 12 C 60 8, 40 14, 30 26 C 24 36, 26 44, 28 50 Z" fill="url(#hairGradDHH)"/>

  <!-- Blazer & Shoulders (Euro Chic Black / Charcoal) -->
  <path d="M 20 114 C 24 88, 42 82, 60 82 C 78 82, 96 88, 100 114 Z" fill="#1e242d" stroke="#0f141a" stroke-width="1.5"/>
  <!-- Black Crewneck Collar -->
  <path d="M 48 82 C 52 92, 68 92, 72 82 Z" fill="#090c10"/>
  <!-- Blazer Lapels -->
  <polygon points="40,82 46,104 53,82" fill="#2d3748"/>
  <polygon points="80,82 74,104 67,82" fill="#2d3748"/>

  <!-- Neck -->
  <rect x="52" y="74" width="16" height="14" fill="#e8bc9e"/>

  <!-- Head / Face (Sharp Nordic Jawline) -->
  <path d="M 36 44 C 36 34, 46 26, 60 26 C 74 26, 84 34, 84 44 C 84 62, 76 76, 60 78 C 44 76, 36 62, 36 44 Z" fill="url(#skinGradDHH)"/>

  <!-- Ears -->
  <ellipse cx="35" cy="50" rx="4" ry="7" fill="#f0cbaf"/>
  <ellipse cx="85" cy="50" rx="4" ry="7" fill="#f0cbaf"/>

  <!-- Swept Front Hair (Iconic DHH Quiff) -->
  <path d="M 34 38 C 38 22, 54 14, 72 16 C 88 18, 92 28, 86 34 C 76 22, 58 20, 44 26 C 36 30, 34 35, 34 38 Z" fill="url(#hairGradDHH)"/>
  <path d="M 42 24 C 52 16, 68 15, 80 20 C 72 17, 56 18, 45 25 Z" fill="#6d4934"/>

  <!-- Eyebrows (Strong, Confident) -->
  <path d="M 44 43 Q 50 40 56 42" stroke="#2c1a11" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 64 42 Q 70 40 76 43" stroke="#2c1a11" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Determined, Thoughtful) -->
  <ellipse cx="50" cy="48" rx="3.2" ry="2.2" fill="#1e293b"/>
  <circle cx="50.8" cy="47.5" r="0.8" fill="#ffffff"/>
  <ellipse cx="70" cy="48" rx="3.2" ry="2.2" fill="#1e293b"/>
  <circle cx="70.8" cy="47.5" r="0.8" fill="#ffffff"/>

  <!-- Nose (Sharp) -->
  <path d="M 60 46 L 58 57 L 63 57" stroke="#cb987b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Subtle Stubble / 5 O'Clock Shadow -->
  <path d="M 42 60 C 44 72, 52 76, 60 76 C 68 76, 76 72, 78 60 C 72 64, 60 66, 42 60 Z" fill="#d9a888" opacity="0.45"/>

  <!-- Confident Smile / Mouth -->
  <path d="M 52 64 Q 60 68 68 64" stroke="#8d4b38" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
