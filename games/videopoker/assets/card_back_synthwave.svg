<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 272" width="188" height="272">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080612"/>
      <stop offset="45%" stop-color="#140D2B"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>

    <!-- Retro Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="35%" stop-color="#FF5E00"/>
      <stop offset="75%" stop-color="#FF1493"/>
      <stop offset="100%" stop-color="#8A00FF"/>
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#FF2A85"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sun Clip Path for horizontal stripe blinds -->
    <mask id="sunMask">
      <rect x="0" y="0" width="188" height="272" fill="#fff"/>
      <!-- Sliced Horizontal Blind Gaps in lower sun -->
      <rect x="0" y="86" width="188" height="1.5" fill="#000"/>
      <rect x="0" y="91" width="188" height="2.2" fill="#000"/>
      <rect x="0" y="97" width="188" height="3.0" fill="#000"/>
      <rect x="0" y="104" width="188" height="3.8" fill="#000"/>
      <rect x="0" y="112" width="188" height="4.8" fill="#000"/>
      <rect x="0" y="121" width="188" height="6.0" fill="#000"/>
    </mask>

    <!-- Perspective Grid Clip -->
    <clipPath id="gridClip">
      <rect x="10" y="122" width="168" height="140"/>
    </clipPath>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="186" height="270" rx="14" fill="url(#bgGrad)" stroke="#00F0FF" stroke-width="2"/>

  <!-- Inner Neon Magenta Frame -->
  <rect x="7" y="7" width="174" height="258" rx="10" fill="none" stroke="#FF2A85" stroke-width="1.2" opacity="0.85"/>
  <rect x="10" y="10" width="168" height="252" rx="8" fill="none" stroke="#00F0FF" stroke-width="0.75" opacity="0.5"/>

  <!-- Segmented Retro Synthwave Sun -->
  <g mask="url(#sunMask)">
    <circle cx="94" cy="94" r="52" fill="url(#sunGrad)" filter="url(#neonGlow)"/>
  </g>

  <!-- Wireframe Perspective Ground Grid -->
  <g clip-path="url(#gridClip)">
    <!-- Horizon Glow Line -->
    <line x1="10" y1="122" x2="178" y2="122" stroke="#FF2A85" stroke-width="2" filter="url(#neonGlow)"/>
    <line x1="10" y1="124" x2="178" y2="124" stroke="#00F0FF" stroke-width="1"/>

    <!-- Horizontal Grid Lines (Perspective spacing) -->
    <line x1="10" y1="128" x2="178" y2="128" stroke="#00F0FF" stroke-width="0.6" opacity="0.35"/>
    <line x1="10" y1="135" x2="178" y2="135" stroke="#00F0FF" stroke-width="0.7" opacity="0.45"/>
    <line x1="10" y1="144" x2="178" y2="144" stroke="#00F0FF" stroke-width="0.8" opacity="0.55"/>
    <line x1="10" y1="156" x2="178" y2="156" stroke="#00F0FF" stroke-width="0.9" opacity="0.65"/>
    <line x1="10" y1="172" x2="178" y2="172" stroke="#00F0FF" stroke-width="1.0" opacity="0.75"/>
    <line x1="10" y1="193" x2="178" y2="193" stroke="#00F0FF" stroke-width="1.1" opacity="0.85"/>
    <line x1="10" y1="220" x2="178" y2="220" stroke="#00F0FF" stroke-width="1.2" opacity="0.95"/>
    <line x1="10" y1="254" x2="178" y2="254" stroke="#00F0FF" stroke-width="1.3" opacity="1.0"/>

    <!-- Perspective Lines radiating from vanishing point (94, 122) -->
    <line x1="94" y1="122" x2="94" y2="272" stroke="#00F0FF" stroke-width="1.0" opacity="0.9"/>
    <line x1="94" y1="122" x2="68" y2="272" stroke="#00F0FF" stroke-width="0.9" opacity="0.8"/>
    <line x1="94" y1="122" x2="120" y2="272" stroke="#00F0FF" stroke-width="0.9" opacity="0.8"/>
    <line x1="94" y1="122" x2="40" y2="272" stroke="#00F0FF" stroke-width="0.9" opacity="0.75"/>
    <line x1="94" y1="122" x2="148" y2="272" stroke="#00F0FF" stroke-width="0.9" opacity="0.75"/>
    <line x1="94" y1="122" x2="10" y2="272" stroke="#00F0FF" stroke-width="0.8" opacity="0.7"/>
    <line x1="94" y1="122" x2="178" y2="272" stroke="#00F0FF" stroke-width="0.8" opacity="0.7"/>
    <line x1="94" y1="122" x2="-20" y2="260" stroke="#00F0FF" stroke-width="0.7" opacity="0.6"/>
    <line x1="94" y1="122" x2="208" y2="260" stroke="#00F0FF" stroke-width="0.7" opacity="0.6"/>
    <line x1="94" y1="122" x2="-40" y2="200" stroke="#00F0FF" stroke-width="0.6" opacity="0.5"/>
    <line x1="94" y1="122" x2="228" y2="200" stroke="#00F0FF" stroke-width="0.6" opacity="0.5"/>
    <line x1="94" y1="122" x2="-50" y2="150" stroke="#00F0FF" stroke-width="0.5" opacity="0.4"/>
    <line x1="94" y1="122" x2="238" y2="150" stroke="#00F0FF" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Centered Floating Neon Medallion -->
  <g transform="translate(94, 136)">
    <!-- Medallion Outer Halo -->
    <rect x="-32" y="-32" width="64" height="64" rx="14" fill="#0C081E" stroke="#FF2A85" stroke-width="2" filter="url(#neonGlow)"/>
    <rect x="-28" y="-28" width="56" height="56" rx="10" fill="none" stroke="#00F0FF" stroke-width="1.2"/>

    <!-- Omarchy Concentric Square Logo in Glowing Neon -->
    <rect x="-20" y="-20" width="40" height="40" rx="3" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
    <rect x="-13" y="-13" width="26" height="26" rx="2" fill="none" stroke="#FF2A85" stroke-width="2"/>
    <rect x="-6" y="-6" width="12" height="12" rx="1" fill="#FFE600" stroke="#FFE600" stroke-width="1"/>

    <!-- Small Corner Accent Dots -->
    <circle cx="-16.5" cy="-16.5" r="1.2" fill="#FFE600"/>
    <circle cx="16.5" cy="-16.5" r="1.2" fill="#FFE600"/>
    <circle cx="-16.5" cy="16.5" r="1.2" fill="#FFE600"/>
    <circle cx="16.5" cy="16.5" r="1.2" fill="#FFE600"/>
  </g>

  <!-- 80s Retro Title Header & Footer -->
  <g transform="translate(94, 28)">
    <text text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="11" letter-spacing="3" fill="#00F0FF" filter="url(#neonGlow)">OMARCHY</text>
  </g>
  <g transform="translate(94, 252)">
    <text text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="9" letter-spacing="3" fill="#FF2A85" opacity="0.9">RETROWAVE</text>
  </g>

  <!-- Geometric Corner Accents -->
  <path d="M 14 20 L 20 14" stroke="#00F0FF" stroke-width="1.5"/>
  <path d="M 174 20 L 168 14" stroke="#00F0FF" stroke-width="1.5"/>
  <path d="M 14 252 L 20 258" stroke="#FF2A85" stroke-width="1.5"/>
  <path d="M 174 252 L 168 258" stroke="#FF2A85" stroke-width="1.5"/>
</svg>
