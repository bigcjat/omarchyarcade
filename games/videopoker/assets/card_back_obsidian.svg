<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 272" width="188" height="272">
  <defs>
    <radialGradient id="obsidianBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E1E28"/>
      <stop offset="60%" stop-color="#12131A"/>
      <stop offset="100%" stop-color="#08090D"/>
    </radialGradient>
    <linearGradient id="circuitGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="circuitPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 0 16 L 12 16 L 16 12 L 16 0 M 16 32 L 16 20 L 20 16 L 32 16" fill="none" stroke="#F59E0B" stroke-width="0.75" opacity="0.25"/>
      <circle cx="12" cy="16" r="1.5" fill="#F59E0B" opacity="0.4"/>
      <circle cx="20" cy="16" r="1.5" fill="#F59E0B" opacity="0.4"/>
      <path d="M 0 0 L 6 6 L 6 10 M 32 32 L 26 26 L 26 22" fill="none" stroke="#F59E0B" stroke-width="0.75" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="186" height="270" rx="14" fill="url(#obsidianBg)" stroke="#F59E0B" stroke-width="1.8"/>

  <!-- Inner Tech Borders -->
  <rect x="6" y="6" width="176" height="260" rx="10" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.7"/>
  <rect x="9" y="9" width="170" height="254" rx="8" fill="none" stroke="#38BDF8" stroke-width="0.6" opacity="0.5"/>

  <!-- Background Circuit Lattice -->
  <rect x="10" y="10" width="168" height="252" rx="7" fill="url(#circuitPattern)"/>

  <!-- High-Tech Circuit Traces -->
  <g stroke="url(#circuitGold)" stroke-width="1.2" fill="none" opacity="0.65">
    <path d="M 20 20 L 40 20 L 50 30 L 70 30"/>
    <circle cx="70" cy="30" r="2" fill="#F59E0B"/>
    <path d="M 168 20 L 148 20 L 138 30 L 118 30"/>
    <circle cx="118" cy="30" r="2" fill="#F59E0B"/>
    <path d="M 20 252 L 40 252 L 50 242 L 70 242"/>
    <circle cx="70" cy="242" r="2" fill="#F59E0B"/>
    <path d="M 168 252 L 148 252 L 138 242 L 118 242"/>
    <circle cx="118" cy="242" r="2" fill="#F59E0B"/>
  </g>

  <!-- Center Core Emblem -->
  <g transform="translate(94, 136)">
    <!-- Tech Octagon Core -->
    <polygon points="0,-40 28,-28 40,0 28,28 0,40 -28,28 -40,0 -28,-28" fill="#0A0B10" stroke="#F59E0B" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="32" fill="#141622" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Concentric Omarchy Square -->
    <rect x="-18" y="-18" width="36" height="36" rx="3" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <rect x="-11" y="-11" width="22" height="22" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
    <rect x="-5" y="-5" width="10" height="10" rx="1" fill="#F59E0B"/>

    <!-- Circuit Nodes around Core -->
    <circle cx="0" cy="-36" r="2" fill="#38BDF8"/>
    <circle cx="0" cy="36" r="2" fill="#38BDF8"/>
    <circle cx="-36" cy="0" r="2" fill="#38BDF8"/>
    <circle cx="36" cy="0" r="2" fill="#38BDF8"/>
  </g>

  <!-- Title Accents -->
  <text x="94" y="27" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="bold" font-size="10" letter-spacing="3" fill="#F59E0B">OMARCHY</text>
  <text x="94" y="255" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="bold" font-size="8.5" letter-spacing="3" fill="#38BDF8" opacity="0.9">OBSIDIAN DECK</text>
</svg>
