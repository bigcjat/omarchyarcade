<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Neon Glow Foundation -->
  <circle cx="50" cy="50" r="42" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Outer Beveled Rim -->
  <circle cx="50" cy="50" r="39" fill="#0B0E14" stroke="#00F0FF" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Double King Coronation Rings -->
  <circle cx="50" cy="50" r="32" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3,2"/>
  
  <!-- Vector Royal Crown -->
  <!-- Crown Base Band -->
  <path d="M 32 62 L 68 62 L 66 67 L 34 67 Z" fill="#00F0FF" fill-opacity="0.3" stroke="#00F0FF" stroke-width="2"/>
  
  <!-- Crown Peaks -->
  <path d="M 33 62 L 31 43 L 42 53 L 50 36 L 58 53 L 69 43 L 67 62 Z" fill="#00F0FF" fill-opacity="0.25" stroke="#00F0FF" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Crown Jewels (Peak Finials) -->
  <circle cx="31" cy="41" r="3" fill="#00F0FF"/>
  <circle cx="50" cy="34" r="3.5" fill="#00F0FF"/>
  <circle cx="69" cy="41" r="3" fill="#00F0FF"/>
  
  <!-- Crown Center Jewel -->
  <polygon points="50,46 54,52 50,58 46,52" fill="#00F0FF"/>
  
  <!-- 8 Sunburst Corona Rays on Rim -->
  <line x1="50" y1="9" x2="50" y2="15" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="85" x2="50" y2="91" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="9" y1="50" x2="15" y2="50" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="50" x2="91" y2="50" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="21" x2="25" y2="25" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="79" y1="21" x2="75" y2="25" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="79" x2="25" y2="75" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="79" y1="79" x2="75" y2="75" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
</svg>
